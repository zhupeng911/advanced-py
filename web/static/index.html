<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* 卡片容器 */
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        /* 表单样式 */
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4a90e2;
            color: #fff;
        }

        .btn-primary:hover {
            background: #357abd;
        }

        .btn-success {
            background: #67c23a;
            color: #fff;
        }

        .btn-success:hover {
            background: #5daf34;
        }

        .btn-warning {
            background: #e6a23c;
            color: #fff;
        }

        .btn-warning:hover {
            background: #cf9236;
        }

        .btn-danger {
            background: #f56c6c;
            color: #fff;
        }

        .btn-danger:hover {
            background: #dd6161;
        }

        .btn-secondary {
            background: #909399;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #82848a;
        }

        /* 表格样式 */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #fafafa;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions .btn {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: #f0f0f0;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .info {
            color: #666;
            font-size: 14px;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border-radius: 8px;
            padding: 25px;
            width: 500px;
            max-width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* 消息提示 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: #67c23a;
        }

        .toast.error {
            background: #f56c6c;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>用户管理系统</h1>

        <!-- 创建用户 -->
        <div class="card">
            <div class="card-title">创建用户</div>
            <form id="createForm" class="form-row">
                <div class="form-group">
                    <label>姓名 *</label>
                    <input type="text" name="name" placeholder="请输入姓名" required>
                </div>
                <div class="form-group">
                    <label>邮箱 *</label>
                    <input type="email" name="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label>年龄</label>
                    <input type="number" name="age" placeholder="请输入年龄">
                </div>
                <div class="form-group" style="flex: 0; align-self: flex-end;">
                    <button type="submit" class="btn btn-primary">创建用户</button>
                </div>
            </form>
        </div>

        <!-- 用户列表 -->
        <div class="card">
            <div class="card-title">用户列表</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>姓名</th>
                            <th>邮箱</th>
                            <th>年龄</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <tr>
                            <td colspan="6" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            <div class="pagination">
                <button id="prevBtn" onclick="prevPage()">上一页</button>
                <span class="info" id="pageInfo">第 1 页 / 共 1 页</span>
                <button id="nextBtn" onclick="nextPage()">下一页</button>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">编辑用户</span>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" name="id" id="editId">
                <div class="form-row">
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" name="name" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱 *</label>
                        <input type="email" name="email" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label>年龄</label>
                        <input type="number" name="age" id="editAge">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8081/api/users';

        // 分页状态
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        // 显示消息
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 加载用户列表
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}?page=${currentPage}&page_size=${pageSize}`);
                const result = await response.json();

                if (result.code !== 200) {
                    showToast(result.message || '加载失败', 'error');
                    return;
                }

                const { users, pagination } = result.data;
                totalPages = pagination.total_pages;
                currentPage = pagination.page;

                renderTable(users);
                renderPagination();
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('userTable').innerHTML =
                    '<tr><td colspan="6" class="empty">加载失败，请检查网络</td></tr>';
                showToast('加载失败: ' + error.message, 'error');
            }
        }

        // 渲染表格
        function renderTable(users) {
            const tbody = document.getElementById('userTable');

            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.age || '-'}</td>
                    <td>${formatDate(user.created_at)}</td>
                    <td class="actions">
                        <button class="btn btn-warning" onclick="openEditModal(${user.id})">编辑</button>
                        <button class="btn btn-danger" onclick="deleteUser(${user.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 渲染分页
        function renderPagination() {
            document.getElementById('pageInfo').textContent =
                `第 ${currentPage} 页 / 共 ${totalPages} 页`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        // 上一页
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadUsers();
            }
        }

        // 下一页
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadUsers();
            }
        }

        // 创建用户
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                age: formData.get('age') ? parseInt(formData.get('age')) : null
            };

            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.code === 201) {
                    showToast('创建成功');
                    e.target.reset();
                    loadUsers();
                } else {
                    showToast(result.message || '创建失败', 'error');
                }
            } catch (error) {
                showToast('创建失败: ' + error.message, 'error');
            }
        });

        // 打开编辑模态框
        async function openEditModal(userId) {
            try {
                const response = await fetch(`${API_BASE}/${userId}`);
                const result = await response.json();

                if (result.code === 200) {
                    const user = result.data;
                    document.getElementById('editId').value = user.id;
                    document.getElementById('editName').value = user.name;
                    document.getElementById('editEmail').value = user.email;
                    document.getElementById('editAge').value = user.age || '';
                    document.getElementById('editModal').classList.add('show');
                } else {
                    showToast(result.message || '获取用户信息失败', 'error');
                }
            } catch (error) {
                showToast('获取用户信息失败: ' + error.message, 'error');
            }
        }

        // 关闭编辑模态框
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            document.getElementById('editForm').reset();
        }

        // 更新用户（PATCH）
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('editId').value;
            const formData = new FormData(e.target);

            const data = {};
            const name = formData.get('name');
            const email = formData.get('email');
            const age = formData.get('age');

            if (name) data.name = name;
            if (email) data.email = email;
            if (age) data.age = parseInt(age);

            try {
                const response = await fetch(`${API_BASE}/${userId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.code === 200) {
                    showToast('更新成功');
                    closeEditModal();
                    loadUsers();
                } else {
                    showToast(result.message || '更新失败', 'error');
                }
            } catch (error) {
                showToast('更新失败: ' + error.message, 'error');
            }
        });

        // 删除用户
        async function deleteUser(userId) {
            if (!confirm('确定要删除该用户吗？')) return;

            try {
                const response = await fetch(`${API_BASE}/${userId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.code === 200) {
                    showToast('删除成功');
                    loadUsers();
                } else {
                    showToast(result.message || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败: ' + error.message, 'error');
            }
        }

        // 页面加载完成后获取用户列表
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
